source /opt/openocd/openocd_gpiod.cfg
stm32h5x.cpu configure -event reset-start {}
stm32h5x.cpu configure -event examine-end {}
stm32h5x.cpu configure -event halted {}
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
init
reset halt
flash write_image erase /home/arduino/idk-button/build/IdkButton.ino.elf-zsk.bin 0x08100000 bin
verify_image /home/arduino/idk-button/build/IdkButton.ino.elf-zsk.bin 0x08100000 bin
reset run
sleep 100
mww 0x40036400 0xCAFFEEEE
shutdown
